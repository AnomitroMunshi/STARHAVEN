<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>
    Starhaven · Unit Wiki
  </title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Nunito:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #07080B;
      --panel: #0E1016;
      --panel2: #12151D;
      --border: #1C2028;
      --border2: #242830;
      --parchment: #E4DCC6;
      --muted: #78736A;
      --faint: #383530;
      --gold: #C6A03C;
      --gold-dim: #685218;
      --a-vl: #1A1A1A;
      --a-l-bg: #1A3A1A;
      --a-l: #4A9A4A;
      --a-lm-bg: linear-gradient(90deg, #1A3A1A, #2A2A10);
      --a-lm: #A0A040;
      --a-m-bg: #2A2A10;
      --a-m: #9A9A38;
      --a-mh-bg: linear-gradient(90deg, #2A2A10, #0A1830);
      --a-mh: #7A9060;
      --a-h-bg: #0A1830;
      --a-h: #507AB8;
      --a-vh-bg: #380A0A;
      --a-vh: #B84848;
      --a-leg-bg: #200830;
      --a-leg: #8858C8;
      --c-own: #80C080;
      --c-own-bg: #182818;
      --c-own-b: #2A4A2A;
      --c-ally: #8080C0;
      --c-ally-bg: #181828;
      --c-ally-b: #2A2A4A;
      --c-new: #C090FF;
      --c-new-bg: #201830;
      --c-new-b: #402860;
      --c-gar: #909090;
      --c-gar-bg: #181818;
      --c-gar-b: #303030;
      --c-merc: #C09050;
      --c-merc-bg: #281808;
      --c-merc-b: #4A3018;
      --br-inf: #C86060;
      --br-ran: #60C060;
      --br-cav: #6090D0;
      --br-pol: #C0A050;
      --br-bst: #D08040;
      --br-fly: #8080D8;
      --br-mon: #C060C0;
      --br-mag: #A060D8;
      --br-rel: #D0C050;
      --br-ste: #50C0C0;
      --br-eng: #A0A050;
      --br-art: #C07040;
      --br-nav: #40A0C0;
      --br-und: #8050C0;
      --br-cmd: #C0C050;
      --br-log: #60B060;
      --br-int: #9060C0;
      --br-anm: #70B840;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--parchment);
      font-family: "Nunito", sans-serif;
      font-size: 15px;
      line-height: 1.65;
      padding: 0 0 60px;
    }

    /* NAV */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 8, 11, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border2);
      padding: 0;
    }

    .nav-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .nav-title {
      font-family: "Cinzel", serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      padding: 10px 16px 4px;
      text-align: center;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 2px;
      padding: 6px 12px 8px;
      scrollbar-width: none;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--panel2);
      color: var(--muted);
      white-space: nowrap;
      transition: all .15s;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .tab:hover {
      color: var(--parchment);
      border-color: var(--gold-dim);
    }

    .tab.active {
      color: #0A0A0A;
      border-color: transparent;
    }

    .src-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 5px 12px 8px;
      border-top: 1px solid var(--border);
    }

    .sf {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      padding: 3px 9px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all .12s;
    }

    .sf:hover,
    .sf.active {
      font-weight: 700;
    }

    .sf[data-sf="own"].active {
      background: var(--c-own-bg);
      border-color: var(--c-own-b);
      color: var(--c-own);
    }

    .sf[data-sf="ally"].active {
      background: var(--c-ally-bg);
      border-color: var(--c-ally-b);
      color: var(--c-ally);
    }

    .sf[data-sf="new"].active {
      background: var(--c-new-bg);
      border-color: var(--c-new-b);
      color: var(--c-new);
    }

    .sf[data-sf="gar"].active {
      background: var(--c-gar-bg);
      border-color: var(--c-gar-b);
      color: var(--c-gar);
    }

    .sf[data-sf="merc"].active {
      background: var(--c-merc-bg);
      border-color: var(--c-merc-b);
      color: var(--c-merc);
    }

    /* SEARCH */
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px 8px;
      border-top: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--parchment);
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      padding: 5px 28px 5px 28px;
      outline: none;
      transition: border-color .15s;
    }

    .search-input:focus {
      border-color: var(--gold-dim);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      display: none;
      background: none;
      border: none;
      padding: 2px 3px;
      line-height: 1;
      transition: color .12s;
    }

    .search-clear:hover {
      color: var(--parchment);
    }

    .search-clear.visible {
      display: block;
    }

    .search-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 70px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 28px 16px 22px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "✦";
      margin: 0 8px;
    }

    .hero h1 {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(24px, 5vw, 52px);
      background: linear-gradient(180deg, #EDE4C8, var(--gold) 65%, var(--gold-dim));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .05em;
    }

    .hero-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* WRAP */
    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* BRANCH SECTION */
    .branch-section {
      margin: 28px 0 0;
      scroll-margin-top: 110px;
    }

    .branch-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 5px 5px 0 0;
      margin-bottom: 16px;
    }

    .branch-name {
      font-family: "Cinzel", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .branch-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, currentColor, transparent);
      opacity: .3;
    }

    /* SUB-CLASS GROUP */
    .sub-group {
      margin-bottom: 20px;
    }

    .sub-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    /* UNIT CARD — Horizontal */
    .unit-card {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 5px;
      overflow: hidden;
      min-height: 0;
      height: 100%;
      transition: border-color .15s;
      cursor: pointer;
    }

    .unit-card:hover {
      border-color: var(--gold-dim);
    }

    .unit-card.hidden {
      display: none;
    }

    /* CARD OPEN / MODAL */
    .card-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: rgba(7, 8, 11, 0.85);
      backdrop-filter: blur(6px);
      z-index: 250;
    }

    .card-modal.active {
      display: flex;
    }

    .card-modal .modal-card {
      position: relative;
      width: 100%;
      max-width: min(1440px, 96vw);
      max-height: calc(100vh - 16px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
    }

    .card-modal .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      background: rgba(0, 0, 0, .25);
      color: var(--parchment);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-modal .modal-body {
      padding: 0;
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .card-modal .modal-body .unit-card {
      width: 100%;
      display: flex;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    .card-modal .modal-body .card-img {
      width: 560px;
      min-width: 560px;
      align-self: stretch;
    }

    .card-modal .modal-body .card-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 26px 32px;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
      min-height: 0;
    }

    .card-modal .modal-body .unit-name {
      font-size: 20px;
    }

    .card-modal .modal-body .armor-row {
      font-size: 13px;
      gap: 10px;
    }

    .card-modal .modal-body .a-slot {
      min-width: 55px;
    }

    .card-modal .modal-body .a-desc {
      font-size: 13px;
    }

    .card-modal .modal-body .branch-tag {
      font-size: 10px;
    }

    .card-modal .modal-body .class-name {
      font-size: 15px;
    }

    .card-modal .modal-body .sub-name {
      font-size: 11px;
    }

    /* ZOOM & PAN */
    .modal-img-container {
      position: relative;
      width: 560px;
      min-width: 560px;
      height: 100%;
      overflow: hidden;
      background: var(--panel2);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-img-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform .1s ease-out;
      cursor: grab;
      user-select: none;
    }

    .modal-img-wrapper img.panning {
      cursor: grabbing;
    }

    .modal-zoom-controls {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .zoom-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(20, 20, 30, 0.8);
      color: var(--parchment);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }

    .zoom-btn:hover {
      background: var(--gold-dim);
      color: #000;
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    .zoom-level {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      padding: 0 6px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* IMAGE */
    .card-img {
      width: 160px;
      min-width: 160px;
      min-height: 213px;
      flex-shrink: 0;
      align-self: stretch;
      background: var(--panel2);
      position: relative;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-img .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 0;
    }

    .placeholder-icon {
      font-size: 24px;
      opacity: .25;
    }

    .placeholder-ratio {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      letter-spacing: .1em;
    }

    /* DETAILS */
    .card-body {
      flex: 1;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    /* HEADER ROW */
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .unit-name {
      font-family: "Cinzel", serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--parchment);
      line-height: 1.2;
    }

    .badge-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .src-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .sp-own {
      background: var(--c-own-bg);
      border: 1px solid var(--c-own-b);
      color: var(--c-own);
    }

    .sp-ally {
      background: var(--c-ally-bg);
      border: 1px solid var(--c-ally-b);
      color: var(--c-ally);
    }

    .sp-new {
      background: var(--c-new-bg);
      border: 1px solid var(--c-new-b);
      color: var(--c-new);
    }

    .sp-gar {
      background: var(--c-gar-bg);
      border: 1px solid var(--c-gar-b);
      color: var(--c-gar);
    }

    .sp-merc {
      background: var(--c-merc-bg);
      border: 1px solid var(--c-merc-b);
      color: var(--c-merc);
    }

    /* ARMOR BADGE */
    .armor-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .a-vl {
      background: #1A1A1A;
      color: #666;
    }

    .a-l {
      background: #1A3A1A;
      color: #4A9A4A;
    }

    .a-lm {
      background: #252510;
      color: #9A9840;
    }

    .a-m {
      background: #2A2A10;
      color: #9A9838;
    }

    .a-mh {
      background: #1A2418;
      color: #709060;
    }

    .a-h {
      background: #0A1830;
      color: #5078B8;
    }

    .a-vh {
      background: #380A0A;
      color: #B84848;
    }

    .a-leg {
      background: #200830;
      color: #8858C8;
    }

    .a-na {
      background: #1A1A1A;
      color: #555;
    }

    /* META */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .branch-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .class-name {
      font-size: 13.5px;
      color: var(--parchment);
      font-weight: 600;
    }

    .sub-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* ARMOR LIST — hidden in grid, shown only in modal */
    .armor-list {
      display: none;
    }

    .opened-card .armor-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .armor-row {
      display: flex;
      gap: 7px;
      align-items: baseline;
      font-size: 12.5px;
      line-height: 1.35;
    }

    .a-slot {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .06em;
      min-width: 46px;
      flex-shrink: 0;
    }

    .a-name {
      color: var(--gold);
      font-weight: 600;
      font-size: 12.5px;
    }

    .a-desc {
      color: var(--muted);
      font-size: 12px;
    }

    /* FOOTER */
    .card-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loc-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .loc-tag::before {
      content: "📍 ";
      font-size: 9px;
    }

    .army-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      border-left: 1px solid var(--border2);
      padding-left: 10px;
    }

    /* BRANCH SPECIFIC COLORS */
    .bh-inf {
      background: #3A0A0A;
      color: var(--br-inf);
    }

    .bh-ran {
      background: #0A2A0A;
      color: var(--br-ran);
    }

    .bh-cav {
      background: #0A1030;
      color: var(--br-cav);
    }

    .bh-pol {
      background: #2A2008;
      color: var(--br-pol);
    }

    .bh-bst {
      background: #2A1408;
      color: var(--br-bst);
    }

    .bh-fly {
      background: #08083A;
      color: var(--br-fly);
    }

    .bh-mon {
      background: #200A20;
      color: var(--br-mon);
    }

    .bh-mag {
      background: #100820;
      color: var(--br-mag);
    }

    .bh-rel {
      background: #2A2008;
      color: var(--br-rel);
    }

    .bh-ste {
      background: #081E1E;
      color: var(--br-ste);
    }

    .bh-eng {
      background: #181808;
      color: var(--br-eng);
    }

    .bh-art {
      background: #200E08;
      color: var(--br-art);
    }

    .bh-nav {
      background: #081820;
      color: var(--br-nav);
    }

    .bh-und {
      background: #0A0618;
      color: var(--br-und);
    }

    .bh-cmd {
      background: #202008;
      color: var(--br-cmd);
    }

    .bh-log {
      background: #0A180A;
      color: var(--br-log);
    }

    .bh-int {
      background: #100818;
      color: var(--br-int);
    }

    .bh-spt {
      background: #081818;
      color: #50A0A0;
    }

    .bh-anm {
      background: #0E2006;
      color: var(--br-anm);
    }

    .bt-inf {

    .modal-nav {
      display: flex;

      padding: 8px 14px;

      gap: 5px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--parchment);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background .14s, border-color .14s;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }

    .modal-nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, .05);
      border-color: var(--gold-dim);
    }

    .modal-nav-btn:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .modal-nav-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
      display: inline-block;
    }

    .modal-nav-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--faint);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── MOBILE MODAL FIX ───────────────────────────────────────────── */
    @media (max-width: 700px) {
      .card-modal {
        padding: 0;
        align-items: flex-end;
      }

      .card-modal .modal-card {
        max-width: 100vw;
        width: 100vw;
        max-height: 92dvh;
        border-radius: 16px 16px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* stack image on top, description below — both in one scrollable column */
      .card-modal .modal-body {
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .card-modal .modal-body .unit-card {
        flex-direction: column;
        overflow: visible;
        min-height: unset;
      }

      /* image: full width, fixed portrait height */
      .card-modal .modal-body .card-img,
      .modal-img-container {
        width: 100% !important;
        min-width: unset !important;
        height: 55vw;
        min-height: 220px;
        max-height: 320px;
        flex-shrink: 0;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      /* description: not independently scrollable — parent scrolls */
      .card-modal .modal-body .card-body {
        overflow-y: visible;
        overflow-x: hidden;
        flex: none;
        width: 100%;
        padding: 18px 16px 32px;
      }

      /* hide zoom controls on mobile to free space */
      .modal-zoom-controls {
        display: none;
      }

      /* tap image → fullscreen overlay */
      .modal-img-wrapper img {
        cursor: zoom-in;
      }
    }

    #imgFullscreen {

    function escapeHtml(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

      const placeholder = `<div class="placeholder" style="${card.image ? 'display:none' : 'display:flex'}"><div class="placeholder-icon">🛡</div><div class="placeholder-ratio">3:4</div></div>`;
      const badgeClass = SRC_PILL_CLASSES[card['data-src']] || 'sp-own';
      const branchTagClass = BRANCH_TAG_CLASSES[card['data-br']] || '';
      const borderColor = BRANCH_COLORS[card['data-br']] || '#383530';
      const armorRows = (card.armor || []).map(a => `
         <div class="armor-row">
          <span class="a-slot">${escapeHtml(a.slot)}</span>
          <span class="a-name">${escapeHtml(a.name)}</span>
          <span class="a-desc">${escapeHtml(a.desc)}</span>
         </div>`).join('');
      const notesHtml = card.notes ? `
        <div class="card-notes">
         <span class="notes-label">Notes</span>
         <span class="notes-text">${escapeHtml(card.notes)}</span>
         <span class="notes-see-more">see more ↗</span>
        </div>` : '';
      const searchText = [card.name, card.className, card.subtitle, card.army, card.location, card['data-br'], card.branch, card.notes || '', (card.armor || []).map(a => a.name).join(' ')].join(' ').toLowerCase();
      return `      <div class="unit-card" data-br="${escapeHtml(card['data-br'])}" data-src="${escapeHtml(card['data-src'])}" data-search="${escapeHtml(searchText)}" id="${escapeHtml(card.id)}" style="border-left:3px solid ${borderColor}">
       <div class="card-img">
        ${image}${placeholder}
       </div>
       <div class="card-body">
        <div class="card-head">
         <span class="unit-name">${escapeHtml(card.name)}</span>
         <div class="badge-row">
          <span class="src-pill ${badgeClass}">${escapeHtml(card.srcPill || card['data-src'])}</span>
          <span class="${escapeHtml(card.armorClass)}">${escapeHtml(card.armorBadge || '')}</span>
         </div>
        </div>
        <div class="card-meta">
         <span class="branch-tag ${branchTagClass}">${escapeHtml(card.branch || card['data-br'])}</span>
         <span class="class-name">${escapeHtml(card.className || '')}</span>
         <span class="sub-name">${escapeHtml(card.subtitle || '')}</span>
        </div>
        <div class="armor-list">${armorRows}
        </div>${notesHtml}
        <div class="card-foot">
         <span class="loc-tag">${escapeHtml(card.location || '')}</span>
         <span class="army-tag">${escapeHtml(card.army || '')}</span>
        </div>
       </div>
      </div>`;
    }

    function renderUnitWiki() {
      const container = document.getElementById('unit-content');
      if (!container) return;
      container.innerHTML = UNIT_DATA.map(section => {
        const sectionRows = section.subgroups.map(group => `
     <div class="sub-group">
      <div class="sub-label">${escapeHtml(group.label)}</div>
      <div class="card-grid">${group.cards.map(renderCard).join('')}
      </div>
     </div>`).join('');
        return `
    <div class="branch-section" data-sec="${escapeHtml(section['data-sec'])}" id="${escapeHtml(section.id)}">
     <div class="branch-header ${BRANCH_HEADER_CLASSES[section['data-sec']] || ''}">
      <span class="branch-name">${escapeHtml(section.branch)}</span>
      <span class="branch-line"></span>
     </div>${sectionRows}
    </div>`;
      }).join('');
    }

    renderUnitWiki();
  </script>
  <script>
    // Branch filter
    let activeBr = "all", activeSf = "all", activeSearch = "";

    function applyFilters() {
      const q = activeSearch.trim().toLowerCase();
      let visibleCount = 0;
      const allCards = document.querySelectorAll(".unit-card");

      allCards.forEach(c => {
        const brOk = activeBr === "all" || c.dataset.br === activeBr;
        const sfOk = activeSf === "all" || c.dataset.src === activeSf;
        const sqOk = !q || (c.dataset.search || "").includes(q);
        const visible = brOk && sfOk && sqOk;
        c.classList.toggle("hidden", !visible);
        if (visible) visibleCount++;
      });

      // Hide sub-groups with no visible cards
      document.querySelectorAll(".sub-group").forEach(sg => {
        sg.style.display = sg.querySelector(".unit-card:not(.hidden)") ? "" : "none";
      });

      // Hide branch-sections with no visible cards
      document.querySelectorAll(".branch-section").forEach(sec => {
        sec.style.display = sec.querySelector(".unit-card:not(.hidden)") ? "" : "none";
      });

      // Update count display
      const countEl = document.getElementById("searchCount");
      if (countEl) {
        if (q) {
          countEl.textContent = visibleCount + " / " + allCards.length + " units";
        } else if (activeBr !== "all" || activeSf !== "all") {
          countEl.textContent = visibleCount + " units";
        } else {
          countEl.textContent = "";
        }
      }
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        activeBr = t.dataset.br;
        applyFilters();
        if (activeBr !== "all") {
          const el = document.getElementById("sec-" + activeBr.toLowerCase().replace(" ", "-").replace(" cavalry", ""));
          if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        }
      });
    });

    document.querySelectorAll(".sf").forEach(s => {
      s.addEventListener("click", () => {
        document.querySelectorAll(".sf").forEach(x => x.classList.remove("active"));
        s.classList.add("active");
        activeSf = s.dataset.sf;
        applyFilters();
      });
    });

    // Search
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");

    searchInput.addEventListener("input", () => {
      activeSearch = searchInput.value;
      searchClear.classList.toggle("visible", activeSearch.length > 0);
      applyFilters();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      activeSearch = "";
      searchClear.classList.remove("visible");
      applyFilters();
      searchInput.focus();
    });

    // Ctrl+F / Cmd+F shortcut focuses the search bar
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "f") {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Card open modal
    const cardModal = document.getElementById("cardModal");
    const modalBody = cardModal.querySelector(".modal-body");
    const modalClose = cardModal.querySelector(".modal-close");
    const modalPrev = document.getElementById("modalPrev");
    const modalNext = document.getElementById("modalNext");
    const modalNavCount = document.getElementById("modalNavCount");
    const modalPrevLabel = document.getElementById("modalPrevLabel");
    const modalNextLabel = document.getElementById("modalNextLabel");
    let currentCardIdx = -1;

    function getVisibleCards() {
      return Array.from(document.querySelectorAll(".unit-card:not(.hidden)"));
    }

    function updateModalNav(cards, idx) {
      const prev = cards[idx - 1];
      const next = cards[idx + 1];
      modalPrev.disabled = !prev;
      modalNext.disabled = !next;
      modalPrevLabel.textContent = prev ? (prev.querySelector(".unit-name")?.textContent || "—") : "";
      modalNextLabel.textContent = next ? (next.querySelector(".unit-name")?.textContent || "—") : "";
      modalNavCount.textContent = `${idx + 1} / ${cards.length}`;
    }

    function openCardByIndex(idx) {
      const cards = getVisibleCards();
      if (idx < 0 || idx >= cards.length) return;
      currentCardIdx = idx;
      openCardModal(cards[idx]);
      updateModalNav(cards, idx);
    }

    function initZoomPan(container, img, zoomLabel) {
      let scale = 1, tx = 0, ty = 0;
      let isDragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
      let lastTouchDist = 0;
      const ac = new AbortController();
      const sig = { signal: ac.signal };
      container._zoomCleanup = () => ac.abort();

      function clamp() {
        const maxTx = Math.max(0, (scale - 1) * container.offsetWidth / 2);
        const maxTy = Math.max(0, (scale - 1) * container.offsetHeight / 2);
        tx = Math.max(-maxTx, Math.min(maxTx, tx));
        ty = Math.max(-maxTy, Math.min(maxTy, ty));
      }

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomLabel.textContent = Math.round(scale * 100) + '%';
      }

      function zoom(factor, originX, originY) {
        const prev = scale;
        scale = Math.max(1, Math.min(6, scale * factor));
        if (scale === 1) { tx = 0; ty = 0; }
        else {
          // shift translation so zoom appears anchored to the cursor point
          const rect = container.getBoundingClientRect();
          const cx = (originX ?? rect.left + rect.width / 2) - rect.left - rect.width / 2;
          const cy = (originY ?? rect.top + rect.height / 2) - rect.top - rect.height / 2;
          tx += cx * (1 - scale / prev);
          ty += cy * (1 - scale / prev);
          clamp();
        }
        apply();
      }

      // Wheel zoom
      container.addEventListener('wheel', e => {
        e.preventDefault();
        zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
      }, { passive: false, signal: ac.signal });

      // Zoom buttons
      container.parentElement.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const a = btn.dataset.action;
          if (a === 'in') zoom(1.25);
          else if (a === 'out') zoom(1 / 1.25);
          else if (a === 'reset') { scale = 1; tx = 0; ty = 0; apply(); }
        }, sig);
      });

      // Mouse drag
      img.addEventListener('mousedown', e => {
        if (scale <= 1) return;
        e.preventDefault();
        isDragging = true;
        startX = e.clientX - tx; startY = e.clientY - ty;
        img.classList.add('panning');
      }, sig);

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        tx = e.clientX - startX;
        ty = e.clientY - startY;
        clamp(); apply();
      }, sig);

      window.addEventListener('mouseup', () => {
        isDragging = false;
        img.classList.remove('panning');
      }, sig);

      // Touch pinch-zoom + drag
      container.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        } else if (e.touches.length === 1 && scale > 1) {
          isDragging = true;
          startX = e.touches[0].clientX - tx;
          startY = e.touches[0].clientY - ty;
        }
      }, { passive: true, signal: ac.signal });

      container.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length === 2) {
          const d = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoom(d / lastTouchDist, mx, my);
          lastTouchDist = d;
        } else if (e.touches.length === 1 && isDragging) {
          tx = e.touches[0].clientX - startX;
          ty = e.touches[0].clientY - startY;
          clamp(); apply();
        }
      }, { passive: false, signal: ac.signal });

      container.addEventListener('touchend', () => {
        isDragging = false; lastTouchDist = 0;
      }, { passive: true, signal: ac.signal });
    }

    function openCardModal(card) {
      modalBody.innerHTML = "";
      const clone = card.cloneNode(true);
      clone.classList.add("opened-card");
      clone.style.margin = "0";

      // Replace card-img with zoomable container
      const cardImg = clone.querySelector('.card-img');
      const srcImg = cardImg && cardImg.querySelector('img');
      if (srcImg && srcImg.src) {
        const container = document.createElement('div');
        container.className = 'modal-img-container';

        const wrapper = document.createElement('div');
        wrapper.className = 'modal-img-wrapper';

        const zoomImg = document.createElement('img');
        zoomImg.src = srcImg.src;
        zoomImg.alt = srcImg.alt || '';
        zoomImg.draggable = false;

        const controls = document.createElement('div');
        controls.className = 'modal-zoom-controls';
        controls.innerHTML =
          '<button class="zoom-btn" data-action="out" title="Zoom out">&#8722;</button>' +
          '<span class="zoom-level">100%</span>' +
          '<button class="zoom-btn" data-action="in"  title="Zoom in">&#43;</button>' +
          '<button class="zoom-btn" data-action="reset" title="Reset" style="font-size:11px">&#8635;</button>';

        wrapper.appendChild(zoomImg);
        container.appendChild(wrapper);
        container.appendChild(controls);
        cardImg.replaceWith(container);

        // init after append so offsetWidth is available
        requestAnimationFrame(() => {
          const label = controls.querySelector('.zoom-level');
          initZoomPan(container, zoomImg, label);
        });

        // mobile tap → fullscreen
        zoomImg.addEventListener('click', () => {
          if (window.matchMedia('(max-width: 700px)').matches) {
            openImgFullscreen(zoomImg.src, zoomImg.alt);
          }
        });
      }

      modalBody.appendChild(clone);
      cardModal.classList.add("active");
      cardModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeCardModal() {
      const container = modalBody.querySelector('.modal-img-container');
      if (container && container._zoomCleanup) container._zoomCleanup();
      cardModal.classList.remove("active");
      cardModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      modalBody.innerHTML = "";
    }

    const imgFullscreen = document.getElementById('imgFullscreen');
    const imgFsImg = document.getElementById('imgFsImg');
    const imgFsClose = document.getElementById('imgFsClose');

    function openImgFullscreen(src, alt) {
      imgFsImg.src = src;
      imgFsImg.alt = alt || '';
      imgFullscreen.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeImgFullscreen() {
      imgFullscreen.classList.remove('open');
      imgFsImg.src = '';
      document.body.style.overflow = 'hidden'; // keep card modal scroll locked
    }

    imgFsClose.addEventListener('click', closeImgFullscreen);
    imgFullscreen.addEventListener('click', e => {
      if (e.target === imgFullscreen) closeImgFullscreen();
    });

    document.querySelectorAll(".unit-card").forEach(card => {
      card.addEventListener("click", () => {
        const cards = getVisibleCards();
        openCardByIndex(cards.indexOf(card));
      });
    });

    modalClose.addEventListener("click", closeCardModal);
    cardModal.addEventListener("click", e => {
      if (e.target === cardModal) closeCardModal();
    });

    modalPrev.addEventListener("click", () => openCardByIndex(currentCardIdx - 1));
    modalNext.addEventListener("click", () => openCardByIndex(currentCardIdx + 1));

    document.addEventListener("keydown", e => {
      if (!cardModal.classList.contains("active")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); openCardByIndex(currentCardIdx + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); openCardByIndex(currentCardIdx - 1); }
      if (e.key === "Escape") closeCardModal();
    });

    // Scroll spy
    const sections = document.querySelectorAll(".branch-section");
    const tabs = document.querySelectorAll(".tab[data-br]");
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting && activeBr === "all") {
          const sec = e.target.dataset.sec;
          tabs.forEach(t => t.classList.remove("active"));
          const match = document.querySelector(`.tab[data-br="${sec}"]`);
          if (match) match.classList.add("active");
        }
      });
    }, { threshold: 0.3, rootMargin: "-120px 0px -50% 0px" });
    sections.forEach(s => obs.observe(s));
  </script>
</body>
