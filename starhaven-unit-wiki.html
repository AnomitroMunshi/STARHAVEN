<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>
    Starhaven · Unit Wiki
  </title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Nunito:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #07080B;
      --panel: #0E1016;
      --panel2: #12151D;
      --border: #1C2028;
      --border2: #242830;
      --parchment: #E4DCC6;
      --muted: #78736A;
      --faint: #383530;
      --gold: #C6A03C;
      --gold-dim: #685218;
      --a-vl: #1A1A1A;
      --a-l-bg: #1A3A1A;
      --a-l: #4A9A4A;
      --a-lm-bg: linear-gradient(90deg, #1A3A1A, #2A2A10);
      --a-lm: #A0A040;
      --a-m-bg: #2A2A10;
      --a-m: #9A9A38;
      --a-mh-bg: linear-gradient(90deg, #2A2A10, #0A1830);
      --a-mh: #7A9060;
      --a-h-bg: #0A1830;
      --a-h: #507AB8;
      --a-vh-bg: #380A0A;
      --a-vh: #B84848;
      --a-leg-bg: #200830;
      --a-leg: #8858C8;
      --c-own: #80C080;
      --c-own-bg: #182818;
      --c-own-b: #2A4A2A;
      --c-ally: #8080C0;
      --c-ally-bg: #181828;
      --c-ally-b: #2A2A4A;
      --c-new: #C090FF;
      --c-new-bg: #201830;
      --c-new-b: #402860;
      --c-gar: #909090;
      --c-gar-bg: #181818;
      --c-gar-b: #303030;
      --c-merc: #C09050;
      --c-merc-bg: #281808;
      --c-merc-b: #4A3018;
      --br-inf: #C86060;
      --br-ran: #60C060;
      --br-cav: #6090D0;
      --br-pol: #C0A050;
      --br-bst: #D08040;
      --br-fly: #8080D8;
      --br-mon: #C060C0;
      --br-mag: #A060D8;
      --br-rel: #D0C050;
      --br-ste: #50C0C0;
      --br-eng: #A0A050;
      --br-art: #C07040;
      --br-nav: #40A0C0;
      --br-und: #8050C0;
      --br-cmd: #C0C050;
      --br-log: #60B060;
      --br-int: #9060C0;
      --br-anm: #70B840;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--parchment);
      font-family: "Nunito", sans-serif;
      font-size: 15px;
      line-height: 1.65;
      padding: 0 0 60px;
    }

    /* NAV */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 8, 11, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border2);
      padding: 0;
    }

    .nav-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .nav-title {
      font-family: "Cinzel", serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      padding: 10px 16px 4px;
      text-align: center;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 2px;
      padding: 6px 12px 8px;
      scrollbar-width: none;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--panel2);
      color: var(--muted);
      white-space: nowrap;
      transition: all .15s;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .tab:hover {
      color: var(--parchment);
      border-color: var(--gold-dim);
    }

    .tab.active {
      color: #0A0A0A;
      border-color: transparent;
    }

    .src-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 5px 12px 8px;
      border-top: 1px solid var(--border);
    }

    .sf {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      padding: 3px 9px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all .12s;
    }

    .sf:hover,
    .sf.active {
      font-weight: 700;
    }

    .sf[data-sf="own"].active {
      background: var(--c-own-bg);
      border-color: var(--c-own-b);
      color: var(--c-own);
    }

    .sf[data-sf="ally"].active {
      background: var(--c-ally-bg);
      border-color: var(--c-ally-b);
      color: var(--c-ally);
    }

    .sf[data-sf="new"].active {
      background: var(--c-new-bg);
      border-color: var(--c-new-b);
      color: var(--c-new);
    }

    .sf[data-sf="gar"].active {
      background: var(--c-gar-bg);
      border-color: var(--c-gar-b);
      color: var(--c-gar);
    }

    .sf[data-sf="merc"].active {
      background: var(--c-merc-bg);
      border-color: var(--c-merc-b);
      color: var(--c-merc);
    }

    /* SEARCH */
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px 8px;
      border-top: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--parchment);
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      padding: 5px 28px 5px 28px;
      outline: none;
      transition: border-color .15s;
    }

    .search-input:focus {
      border-color: var(--gold-dim);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      display: none;
      background: none;
      border: none;
      padding: 2px 3px;
      line-height: 1;
      transition: color .12s;
    }

    .search-clear:hover {
      color: var(--parchment);
    }

    .search-clear.visible {
      display: block;
    }

    .search-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 70px;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 28px 16px 22px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "✦";
      margin: 0 8px;
    }

    .hero h1 {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(24px, 5vw, 52px);
      background: linear-gradient(180deg, #EDE4C8, var(--gold) 65%, var(--gold-dim));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .05em;
    }

    .hero-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* WRAP */
    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* BRANCH SECTION */
    .branch-section {
      margin: 28px 0 0;
      scroll-margin-top: 110px;
    }

    .branch-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 5px 5px 0 0;
      margin-bottom: 16px;
    }

    .branch-name {
      font-family: "Cinzel", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .branch-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, currentColor, transparent);
      opacity: .3;
    }

    /* SUB-CLASS GROUP */
    .sub-group {
      margin-bottom: 20px;
    }

    .sub-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    /* UNIT CARD — Horizontal */
    .unit-card {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 5px;
      overflow: hidden;
      min-height: 0;
      height: 100%;
      transition: border-color .15s;
      cursor: pointer;
    }

    .unit-card:hover {
      border-color: var(--gold-dim);
    }

    .unit-card.hidden {
      display: none;
    }

    /* CARD OPEN / MODAL */
    .card-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: rgba(7, 8, 11, 0.85);
      backdrop-filter: blur(6px);
      z-index: 250;
    }

    .card-modal.active {
      display: flex;
    }

    .card-modal .modal-card {
      position: relative;
      width: 100%;
      max-width: min(1440px, 96vw);
      max-height: calc(100vh - 16px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
    }

    .card-modal .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      background: rgba(0, 0, 0, .25);
      color: var(--parchment);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-modal .modal-body {
      padding: 0;
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .card-modal .modal-body .unit-card {
      width: 100%;
      display: flex;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    .card-modal .modal-body .card-img {
      width: 560px;
      min-width: 560px;
      align-self: stretch;
    }

    .card-modal .modal-body .card-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
      padding: 24px 26px 32px;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
      min-height: 0;
    }

    .card-modal .modal-body .unit-name {
      font-size: 20px;
    }

    .card-modal .modal-body .armor-row {
      font-size: 13px;
      gap: 10px;
    }

    .card-modal .modal-body .a-slot {
      min-width: 55px;
    }

    .card-modal .modal-body .a-desc {
      font-size: 13px;
    }

    .card-modal .modal-body .branch-tag {
      font-size: 10px;
    }

    .card-modal .modal-body .class-name {
      font-size: 15px;
    }

    .card-modal .modal-body .sub-name {
      font-size: 11px;
    }

    /* ZOOM & PAN */
    .modal-img-container {
      position: relative;
      width: 560px;
      min-width: 560px;
      height: 100%;
      overflow: hidden;
      background: var(--panel2);
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-img-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform .1s ease-out;
      cursor: grab;
      user-select: none;
    }

    .modal-img-wrapper img.panning {
      cursor: grabbing;
    }

    .modal-zoom-controls {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .zoom-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(20, 20, 30, 0.8);
      color: var(--parchment);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }

    .zoom-btn:hover {
      background: var(--gold-dim);
      color: #000;
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    .zoom-level {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      padding: 0 6px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* IMAGE */
    .card-img {
      width: 160px;
      min-width: 160px;
      min-height: 213px;
      flex-shrink: 0;
      align-self: stretch;
      background: var(--panel2);
      position: relative;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-img .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 0;
    }

    .placeholder-icon {
      font-size: 24px;
      opacity: .25;
    }

    .placeholder-ratio {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      letter-spacing: .1em;
    }

    /* DETAILS */
    .card-body {
      flex: 1;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    /* HEADER ROW */
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .unit-name {
      font-family: "Cinzel", serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--parchment);
      line-height: 1.2;
    }

    .badge-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .src-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .sp-own {
      background: var(--c-own-bg);
      border: 1px solid var(--c-own-b);
      color: var(--c-own);
    }

    .sp-ally {
      background: var(--c-ally-bg);
      border: 1px solid var(--c-ally-b);
      color: var(--c-ally);
    }

    .sp-new {
      background: var(--c-new-bg);
      border: 1px solid var(--c-new-b);
      color: var(--c-new);
    }

    .sp-gar {
      background: var(--c-gar-bg);
      border: 1px solid var(--c-gar-b);
      color: var(--c-gar);
    }

    .sp-merc {
      background: var(--c-merc-bg);
      border: 1px solid var(--c-merc-b);
      color: var(--c-merc);
    }

    /* ARMOR BADGE */
    .armor-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .a-vl {
      background: #1A1A1A;
      color: #666;
    }

    .a-l {
      background: #1A3A1A;
      color: #4A9A4A;
    }

    .a-lm {
      background: #252510;
      color: #9A9840;
    }

    .a-m {
      background: #2A2A10;
      color: #9A9838;
    }

    .a-mh {
      background: #1A2418;
      color: #709060;
    }

    .a-h {
      background: #0A1830;
      color: #5078B8;
    }

    .a-vh {
      background: #380A0A;
      color: #B84848;
    }

    .a-leg {
      background: #200830;
      color: #8858C8;
    }

    .a-na {
      background: #1A1A1A;
      color: #555;
    }

    /* META */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .branch-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .class-name {
      font-size: 13.5px;
      color: var(--parchment);
      font-weight: 600;
    }

    .sub-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* ARMOR LIST — hidden in grid, shown only in modal */
    .armor-list {
      display: none;
    }

    .opened-card .armor-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .armor-row {
      display: flex;
      gap: 7px;
      align-items: baseline;
      font-size: 12.5px;
      line-height: 1.35;
    }

    .a-slot {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .06em;
      min-width: 46px;
      flex-shrink: 0;
    }

    .a-name {
      color: var(--gold);
      font-weight: 600;
      font-size: 12.5px;
    }

    .a-desc {
      color: var(--muted);
      font-size: 12px;
    }

    /* FOOTER */
    .card-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loc-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .loc-tag::before {
      content: "📍 ";
      font-size: 9px;
    }

    .army-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      border-left: 1px solid var(--border2);
      padding-left: 10px;
    }

    .total-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--gold);
      border-left: 1px solid var(--border2);
      padding-left: 10px;
      white-space: nowrap;
    }

    .total-tag::before {
      content: "👥 ";
      font-size: 9px;
    }

    .video-link {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--gold);
      border-left: 1px solid var(--border2);
      padding-left: 10px;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
    }

    .video-link:hover {
      text-decoration: underline;
    }

    .video-link::before {
      content: "🎬 ";
      font-size: 9px;
    }

    .opened-card .total-tag {
      font-size: 12px;
      padding: 3px 10px;
      background: rgba(200, 160, 60, 0.08);
      border: 1px solid rgba(200, 160, 60, 0.25);
      border-radius: 3px;
      margin-top: 2px;
    }

    /* BRANCH SPECIFIC COLORS */
    .bh-inf {
      background: #3A0A0A;
      color: var(--br-inf);
    }

    .bh-ran {
      background: #0A2A0A;
      color: var(--br-ran);
    }

    .bh-cav {
      background: #0A1030;
      color: var(--br-cav);
    }

    .bh-pol {
      background: #2A2008;
      color: var(--br-pol);
    }

    .bh-bst {
      background: #2A1408;
      color: var(--br-bst);
    }

    .bh-fly {
      background: #08083A;
      color: var(--br-fly);
    }

    .bh-mon {
      background: #200A20;
      color: var(--br-mon);
    }

      background: #100820;

      color: var(--faint);

    /* ── MODAL NAVIGATION ──────────────────────────────────────────── */
    .modal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel2);
      flex-shrink: 0;
    }

    .modal-nav-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--parchment);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background .14s, border-color .14s;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 1;
    }

    .modal-nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, .05);
      border-color: var(--gold-dim);
    }

    .modal-nav-btn:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .modal-nav-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
      display: inline-block;
    }

    .modal-nav-count {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--faint);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── MOBILE MODAL FIX ───────────────────────────────────────────── */
    @media (max-width: 700px) {
      .card-modal {
        padding: 0;
        align-items: flex-end;
      }

      .card-modal .modal-card {
        max-width: 100vw;
        width: 100vw;
        max-height: 92dvh;
        border-radius: 16px 16px 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* stack image on top, description below — both in one scrollable column */
      .card-modal .modal-body {
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }

      .card-modal .modal-body .unit-card {
        flex-direction: column;
        overflow: visible;
        min-height: unset;
      }

      /* image: full width, fixed portrait height */
      .card-modal .modal-body .card-img,
      .modal-img-container {
        width: 100% !important;
        min-width: unset !important;
        height: 55vw;
        min-height: 220px;
        max-height: 320px;
        flex-shrink: 0;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      /* description: not independently scrollable — parent scrolls */
      .card-modal .modal-body .card-body {
        overflow-y: visible;
        overflow-x: hidden;
        flex: none;
        width: 100%;
        padding: 18px 16px 32px;
      }

      .card-modal .modal-body {
        touch-action: pan-y;
        overscroll-behavior: contain;
      }

      /* hide zoom controls on mobile to free space */
      .modal-zoom-controls {
        display: none;
      }

      /* tap image → fullscreen overlay */
      .modal-img-wrapper img {
        cursor: zoom-in;
      }
    }

    /* ── FULLSCREEN IMAGE OVERLAY ───────────────────────────────────── */
    #imgFullscreen {
      display: none;
      position: fixed;
      inset: 0;

    #imgFullscreen img {

      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;

hat the Vaelmark ignition chamber is the only component of the Ironlock he did not design and that this fact is professionally irritating. He has also noted that it works better than his original powder-pan design. He has not resolved these two facts with each other.",

                "notes": "Kael Varric's standing requirement is absolute for every Starhaven ranged unit: no formation fields without the ability to hold its own line if cavalry reaches it. The Bowmen of the Last Hollow satisfy it on paper, and Kael has made his opinion of that paperwork known. Each archer carries a personal sidearm — mace or shortsword, soldier's choice, picked during training based on build and instinct rather than issued by rank. It is not a fighting role. It is the thing in your hand when the bow has already failed you and running isn't an option anymore.\n\nThe Bowmen do not screen a front. They sit in reserve behind Starhold's walls or, when deployed, behind an existing formation — never the formation itself. Their job is volley density and depth, not survival in the breach. Rhaegar's position is that a unit built to never be the line doesn't need to be built to hold one, just to survive long enough to fall back. Kael's position is that 'long enough to fall back' has gotten people killed before. Both keep their opinion. The sidearms stay.\n\nThey come entirely from the Velhold Grasslands — open plains country where a hunting bow is a working tool before it's ever a weapon, and where sightlines run far enough that a miss costs a family its dinner, not just a point of pride. Recruitment is regional and exclusive; Rhaegar has never diluted the company with outside intake, on the theory that the discipline is cultural as much as trained, and culture doesn't transplant cleanly mid-career.\n\nThe name predates the current company by two generations. The original Last Hollow was a depression in the Velhold plain where a smaller reserve force, cut off and undersupplied, held a flanking position for three days longer than anyone expected them to survive, using exactly this doctrine — distance, volume, and the discipline to never close unless there was no other choice left. They didn't all walk out of it. The ones who did named what came after them in honor of the ones who didn't, and the name stuck because the doctrine stuck.\n\nIn the field, they operate in three-rank rotating volley lines — front rank fires, falls back to reload while rank two advances to fire position, rank three holds reserve arrows and re-fletches damaged stock on the move. It's slower to set up than a standard skirmish line but sustains longer under prolonged engagement, which suits their role: they're not meant to win a fight in the first exchange. They're meant to still be shooting an hour after a normal unit would have run dry — and if it ever comes apart entirely, every one of them has something better than bare hands.",

                "notes": "Neither orc nor goblin alone — the Stonefang Shamans draw from both bloodlines, and the clans have never argued the point. Grik identified them and Drogar gave them standing. What they do is not magic in the way the Arcane Artillery fires, or the Ashen Guard heals. It is older than that. Before a Stonefang engagement, the Shamans walk the line and speak to the dead — specifically, to the warrior-dead of the Stormmassif, the ancestors of every orc and goblin in the formation. The soldiers who hear those names fight differently. Not harder out of anger. Differently, as if something has settled into place behind their eyes. The Shamans do not attack. They do not carry weapons of significance. What they do to enemies is subtler: a working placed on the ground ahead of the enemy advance that makes the air feel wrong, that makes soldiers lose certainty in their footing, that makes the highland wind come from the wrong direction at the wrong moment. None of it would stop a single determined fighter. Across a formation of thousands pressing into Stonefang terrain, it costs lives. They also serve as the Remnant's only field communication layer — the Shamans move between units, through terrain no one else navigates as quickly, carrying Grik's orders in the old bone-notch language that only the clans read.",

                "total": "240",
                "image": "unitImages/drakekin-pyromancers.png",
                "imageAlt": "",
                "notes": "The Drakekin are not Ninth Sky Corps, and the wiki entry exists partly to stop people from assuming otherwise. There are no bonded mounts here, no drake riders, no shared command structure with Velkan's air corps. What there is, is history: Velkan found the founding handful of this bloodline decades back, displaced and without a home in any of the coalition's existing structures, and brought them to Starhaven himself. He holds no formal authority over them — command sits with Rhaegar Thorne, like every other unit in this reserve — but the Drakekin still call him by a title none of Starhaven's official ranks include, and he visits more often than his schedule has any right to allow.\n\nDrakekin physiology runs hot in the literal sense. Pale scale patches along the forearms and jaw, a resting body temperature high enough to be uncomfortable to stand near, and a bloodline gift for pyromancy that doesn't route through a focus crystal or a learned discipline the way human battle magic does. It's closer to an extension of their own metabolism than a cast spell. This makes them fast — no wind-up, no channeling delay, fire that's already half-formed before the intent finishes — and it makes them limited. A Drakekin who pushes too hard burns through their own reserves the same way a body burns through a fever, and the unit's hard ceiling isn't enemy resistance, it's how long an individual caster can keep generating heat before their own system shuts them down.\n\nRhaegar's standing order is short engagement windows only. The Pyromancers do not screen, do not hold a line, and do not get committed early. They go in for a burst — usually under two minutes — and come back out, win or not. Riasa Tem enforces this personally; she has pulled casters mid-engagement against the protest of soldiers still standing, because the alternative is a mage who collapses from internal heat exhaustion on a field with no time to recover them.\n\nWhat makes them worth the limitation is density. Two hundred and forty Drakekin in a two-minute window put out more raw destructive output than most battle mage units manage across a full engagement. Rhaegar reserves them for exactly the moments that math matters — when a formation needs to not exist anymore, right now, and there isn't time to wait for a slower unit to grind through it.",

s Nyx's instrument entirely. He has not deployed them as of Year 1052. The first deployment will be at his discretion, in the engagement where the specific window they require exists and the specific outcome they produce is worth the exposure of the asset.",

                "notes": "Every other unit in Rhaegar's reserve exists to fight once something goes wrong. The Picket Scouts exist so that nothing about 'wrong' is ever a surprise. They are not Rangers, not Null Blades, not built for elimination or strike work — a Picket Scout's entire job is to see something coming and make sure Rhaegar knows about it before it arrives, not after.\n\nThey operate in three-scout cells spread across concentric watch rings around Starhold, with overlapping coverage so no single cell going dark is a blind spot for the whole network. Doctrine is absolute on one point: a Picket Scout who is spotted has already failed, and a Picket Scout who engages has failed twice. Contact means withdrawal and report, full stop — there is no version of the job that includes holding a position or buying time with their lives. Iva Renn has drilled this into every cell personally: 'I would rather get a warning forty seconds late from someone running than get no warning at all from someone who decided to be brave.'\n\nRather than build a separate signal network from nothing, the unit was attached directly into Sara Venn's Thread-Runners relay — every cell carries a resonance token keyed into the existing Resonance Corps network, meaning a confirmed sighting reaches Rhaegar's command post at the same speed as any other Resonance-linked communication, with no separate runner system to fail or intercept. It was the obvious choice once someone pointed out Starhaven already had the fastest communication network in the coalition and the Picket Scouts were the one unit not using it.\n\nThey are the answer to the one gap every other unit in this reserve shares: raw output without warning time is just a force that arrives too late. Rhaegar's entire HQ reserve doctrine — hold back, commit precisely, never overcommit — only works if someone tells him what's coming before it's already there. That someone is the Picket Scouts.",

                    "desc": "— Keyed directly into Sara Venn's existing Resonance Corps relay network. A single activation sends a confirmed-contact signal straight to Rhaegar's command post — no runner, no delay, no separate system. The unit's single most important piece of equipment, more critical than any weapon they carry."

              {
                "id": "skyhunter-lance-battery",

                "name": "Skyhunter Lance Battery",
                "branch": "Artillery",
                "className": "Legendary Mobile Anti-Aerial Siege Engine",
                "subtitle": "· 6 Launchers · Skybreaker Lances · Skymark Guided Strike · Joint Engineering Project",
                "srcPill": "🏰 Own",
                "armorBadge": "Legendary",
                "armorClass": "armor-badge a-h",

                "image": "unitImages/skyhunter-lance-battery.png",
                "imageAlt": "Skyhunter Lance Battery",
                "notes": "The Skyhunter Lance Battery is Starhaven's ultimate mobile anti-aerial siege platform — the answer to the question no one wanted to have to ask: what do you do when the threat in the sky cannot be answered by anything already in the field?\n\nBuilt jointly by the Vaelmark Athenaeum, the Forgehaven Master Smiths, and the Cyrus Engineering Guild over nine years of collaborative development, only six launchers exist. They are not attached to any field army. They are not assigned to any fortress. They sit in the High Command Strategic Reserve, under triple authorization lock, and they stay there until the threat justifies them.\n\nThe threat that justifies them is not a wyvern. It is not a siege drake. Those have answers — Sorin Vael's Ninth Sky Corps, the Iron Talon Batteries, the Stormriders. The Skyhunter Lance Battery exists for the category of aerial threat that none of those answers are sufficient for: an ancient dragon. A Void behemoth with aerial capacity. A flying fortress. Something that conventional anti-aerial doctrine was not built to address because conventional anti-aerial doctrine was not built expecting to address it.\n\nUnlike conventional artillery, the Skyhunter does not fire unguided bolts. It launches Skybreaker Lances — 14-foot blacksteel spears capable of piercing ancient dragon scale before detonating inside the target. The launcher carries six lances in an armored revolving magazine. Once all six are expended, battlefield reloading is impossible. Every lance is handcrafted individually by Forgehaven Master Smiths and classified as a strategic asset in the High Command War Archive. The production of a single lance takes eleven weeks.\n\nGuidance is achieved through the Skymark system, operated by the Skymark Corps — a dedicated unit of 12–18 elite mages riding high-speed wyvern hybrid variants specifically bred for altitude, maneuverability, and speed over endurance. The Skymark mage rides to the target's position — above it, beside it, wherever the target's behavior allows — and designates it with a temporary arcane resonance mark. The launcher synchronizes through a Vaelmark guidance crystal embedded in the lance's flight vanes. The lance performs limited course corrections during approximately 70% of its flight before committing to terminal ballistic impact. If the mark is lost mid-flight, the lance continues unguided on its last corrected trajectory.\n\nTwo to three Skymark mages are assigned per launcher — the redundancy is not optional. A single mark lost to aerial engagement, mount failure, or Void interference is a lance that may miss a target that cannot be missed. Two mages means one mark holds while the other repositions. Three means the system survives contact with an enemy that knows what the mages are doing and is actively trying to stop them from doing it.\n\nFiring authorization requires three signatures: Rayden Cale, Velkan Drake, and Rhaegar Thorne. All three. Not two of three — all three. This is not bureaucratic formality. Each signature represents a specific assessment: Rayden authorizes the strategic commitment of an irreplaceable asset. Velkan assesses whether the aerial threat cannot be answered by any other means in the coalition's current deployment. Rhaegar authorizes the tactical window — the specific moment and conditions under which the lance has a viable firing solution. A lance fired without all three assessments aligned is a lance wasted, and there are only six.\n\nThe Skyhunter Lance Battery has never been deployed in combat as of Year 1052. It has been brought to readiness twice — once in Year 1048 during the Nullborn incursion at Ashveil, when a Void-class aerial entity was reported in the eastern corridor, and once in Year 1051 when intelligence suggested a possible Void-behemoth emergence from the deep Nullborn territory. Both times the threat resolved before deployment was authorized. Both times all three signatures were obtained and then withdrawn when the situation changed.\n\nVelkan Drake, when asked what it felt like to sign a deployment authorization and then withdraw it: 'Like putting Pyrewing back in the aerie when the storm turns.' He did not elaborate. He did not need to.",
                "armor": [
                  {
                    "slot": "Crew",
                    "name": "Skyhunter Battery Plate",
                    "desc": "— Heavy engineer plate designed for operating the launcher under dragon attack and aerial bombardment. Full chest and back coverage, reinforced shoulders and forearms for recoil shock, enclosed neck guard for debris. The plate is heavier than standard field artillery crew armor by approximately 40% — the weight is accepted because the scenarios in which the Skyhunter fires are the scenarios in which things are landing on the crew position from very large heights at very high speeds."
                  },
                  {
                    "slot": "Weapon",
                    "name": "Skyhunter Mk.I Lance Launcher",
                    "desc": "— Massive rotating launch rail mounted on an eight-wheel siege carriage, iron-reinforced hardwood frame with a steel launch tube 18 feet long and 16 inches in bore diameter. 360° horizontal traverse, 15°–85° elevation. Four hydraulic stabilizer legs extend from the carriage underframe before firing — they drive into the ground and lock the carriage against the recoil force of a lance launch, which would otherwise move the carriage approximately 12 feet rearward. The six-lance armored revolving magazine loads from the rear. Deployment from transport position: 12–15 minutes for a trained crew of eight. Once deployed and stabilized, traverse and elevation adjustment takes approximately 90 seconds per major repositioning. The launcher does not move quickly. The Skymark guidance system compensates for this."
                  },
                  {
                    "slot": "Ammo-A",
                    "name": "Dragonpiercer Lance",
                    "desc": "— Fourteen-foot blacksteel spear with an adamantine penetrator tip. The blacksteel shaft is designed to flex fractionally on impact — absorbing the energy spike that would shatter a rigid shaft against ancient dragon scale — before the adamantine tip drives through. A delayed detonation charge in the lance body fires 0.3 seconds after penetration, inside the target. Primary anti-dragon and anti-behemoth round. The adamantine penetrator alone costs more than a Scorpio field battery. Cain Drakhar reviewed the metallurgical specifications. His comment: 'Correct.' He did not add anything."
                  },
                  {
                    "slot": "Ammo-B",
                    "name": "Voidbreaker Lance",
                    "desc": "— Armor-piercing spear carrying a concentrated Voidbane compound core in a sealed chamber behind the penetrator. After penetration, the warhead disperses anti-corruption agents through the target before the detonation charge fires. The internal dispersal-before-detonation sequence destabilizes Void entities from within — the corruption architecture collapses ahead of the physical damage, meaning the detonation encounters a target already structurally compromised. Zareth Kull co-designed the compound chamber. He described the result as 'elegant in the way that the correct solution to a difficult problem is always elegant.' He also noted that he hoped never to need to find out if it worked on a live target."
                  },
                  {
                    "slot": "Ammo-C",
                    "name": "Fortressbreaker Lance",
                    "desc": "— Reinforced penetrator with a larger internal blast chamber — the shaft diameter increases by 3 inches to accommodate the expanded warhead. Designed for flying fortresses, aerial siege platforms, colossal constructs, and heavily armored structures that require destruction rather than penetration-and-detonation. The Fortressbreaker does not rely on getting inside the target — the warhead is large enough to achieve structural destruction on impact if penetration is partial. The Cyrus Engineering Guild designed this variant after a theoretical assessment of what a Void-constructed aerial fortress would require to bring down. The assessment was theoretical. The Fortressbreaker is not."
                  },
                  {
                    "slot": "Guidance",
                    "name": "Skymark Resonance System",
                    "desc": "— The Skymark mage establishes an arcane resonance mark on the target from their wyvern-hybrid mount at close range — as close as the target's behavior and the mage's survival allow. The mark produces a resonance signature that the Vaelmark guidance crystal embedded in the lance's flight vanes synchronizes with at launch. The lance performs limited course corrections during approximately 70% of its flight before committing to terminal ballistic impact — in the final 30% the lance's speed exceeds the guidance system's correction capacity and it runs on its last corrected trajectory. If the mark is lost before the terminal phase, the lance continues unguided. If the mark is lost in the terminal phase, the correction already made is usually sufficient. If the mark is lost in the first half of the flight: a miss is possible. This is why two to three Skymark mages are assigned per launcher."

              {
                "id": "skymark-corps",
                "data-br": "Magic",
                "data-src": "own",
                "name": "Skymark Corps",
                "branch": "Magic",
                "className": "Aerial Target Designation · Guidance Mages",

                "armorClass": "armor-badge a-l",
                "location": "High Command Strategic Reserve — Skyhunter Attachment",

                "image": "unitImages/skymark-corps.png",
                "imageAlt": "Skymark Corps",
                "notes": "The Skymark Corps does not fight. They fly to the target and they mark it and then they get out of the way of what is coming.\n\nTwelve to eighteen mages — the exact number varies based on active launcher deployment, with two to three assigned per active Skyhunter launcher. Their function is target designation for the Skyhunter Lance Battery's guided strike system: a Skymark mage establishes an arcane resonance mark on the designated target at close range, synchronizes with the Skyhunter launcher's Vaelmark guidance crystal, and maintains the mark through the lance's guided flight phase before breaking off. What sounds simple is not simple. Getting close enough to an ancient dragon, a Void behemoth, or a flying fortress to establish a reliable resonance mark is the specific problem the Skymark Corps was built to solve.\n\nTheir mounts are wyvern-hybrid variants — not the standard Ninth Sky Corps drake-riders, not the war wyverns of the aerial combat arm. The Skymark mounts are a specific breeding program developed jointly by Velkan Drake and the Vaelmark Athenaeum over seven years: speed and altitude over endurance and combat capacity. A Skymark mount does not fight. It does not carry a weapons system. It is built to reach a target's position at maximum speed, hold steady long enough for the mage to establish the resonance mark, and then leave that position at maximum speed before the lance arrives. The sequence — reach, mark, leave — typically takes between 40 and 90 seconds depending on the target's behavior. In those 40 to 90 seconds, the Skymark mage is at close range to the most dangerous aerial threat on the battlefield.\n\nThis is the reason for the redundancy. Two to three mages per launcher means that if the primary mage's mount is struck, disabled, or killed during the marking window, a second mage is already in approach position to re-establish the mark before the lance's guided phase ends. A mark that disappears in the first 70% of the lance's flight without a replacement mark means the lance continues unguided — still dangerous, no longer reliably on target. One failed mark is acceptable. Two failed marks on the same launch is a problem that the redundancy prevents.\n\nSkymark mages are selected from the Vaelmark Athenaeum's advanced resonance program — the specific discipline of establishing and maintaining arcane synchronization with a moving object at range while themselves moving through three-dimensional space on a fast-moving mount. It is not a common skill set. The Vaelmark Athenaeum produces approximately three candidates per year who meet the minimum qualification. Of those three, one on average completes the full Skymark Corps training cycle, which takes two years and has a 60% attrition rate that is not attributed to failure — it is attributed to candidates who discover, in the second year of training, that the practical application of the skill set involves flying at close range to simulated targets that are trying to destroy them, and who make a professional assessment that this is not the career they intended.\n\nThe Skymark Corps has never been deployed in combat as of Year 1052. The two readiness alerts in Years 1048 and 1051 brought them to launch position. Both times the deployment was stood down before marks were established. The Corps trains continuously regardless. Velkan Drake oversees their mount development and aerial protocol. He attends their readiness evaluations personally. When asked why he attends personally for a unit that has never been deployed: 'Because the first time they deploy, I need to know they are ready. And by the time I need to know that, there will not be time to find out.'",
                "armor": [
                  {
                    "slot": "Body",
                    "name": "Skymark Flight Coat",
                    "desc": "— Light leather flight coat, reinforced at the shoulders and upper arms. Not designed for combat — designed for high-altitude sustained flight at the speed the wyvern-hybrid mounts operate at, which produces wind shear that standard mage robes do not handle. The coat is fitted rather than draped — anything loose at the speeds these mounts achieve becomes a hazard within thirty seconds. Arcane resonance channels are woven into the coat's forearm lining, allowing the mage to maintain casting focus while both hands are occupied with mount control."

                    "desc": "— Full enclosure with a curved glass visor — the only artillery or magic unit in Starhaven's roster that uses a glass visor rather than an open-face or slit design. At the altitudes and speeds the Skymark mounts operate, wind velocity without eye protection makes sustained visual target acquisition impossible. The glass is Vaelmark-reinforced — impact-resistant against debris, wind-rated for velocities the mages experience at operational altitude. The visor has a faint arcane tint that reduces glare from high-altitude sun exposure, which the Vaelmark Athenaeum added after the first training cohort reported consistent glare interference during marking attempts above cloud level."

                  {

                    "desc": "— Not a standard war wyvern. A purpose-bred hybrid variant from a seven-year development program by Velkan Drake and the Vaelmark Athenaeum. Smaller frame than a combat wyvern — 60% of the body mass, which directly produces the speed advantage. Built for altitude ceiling and sprint velocity over sustained endurance: a Skymark mount can reach 4,000 feet in under six minutes and sustain 80% of peak sprint speed for approximately twelve minutes before requiring recovery. It does not carry weapons. It does not fight. If a combat threat engages a Skymark mount during a marking run, the mount's response is evasion, not engagement — the speed advantage over most aerial combat threats is sufficient to break contact if the evasion begins within the first few seconds of the engagement. If it does not begin within the first few seconds, the redundancy system exists for a reason."

 gunpowder corps that isn't borrowed, allied, or on loan. That status alone makes it one of the more closely watched units in the entire reserve.",

    function escapeHtml(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function renderCard(card) {
      const image = card.image ? `<img alt="${escapeHtml(card.imageAlt || card.name || '')}" src="${escapeHtml(card.image)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>` : '';
      const placeholder = `<div class="placeholder" style="${card.image ? 'display:none' : 'display:flex'}"><div class="placeholder-icon">🛡</div><div class="placeholder-ratio">3:4</div></div>`;
      const badgeClass = SRC_PILL_CLASSES[card['data-src']] || 'sp-own';
      const branchTagClass = BRANCH_TAG_CLASSES[card['data-br']] || '';
      const borderColor = BRANCH_COLORS[card['data-br']] || '#383530';
      const armorRows = (card.armor || []).map(a => `
         <div class="armor-row">
          <span class="a-slot">${escapeHtml(a.slot)}</span>
          <span class="a-name">${escapeHtml(a.name)}</span>
          <span class="a-desc">${escapeHtml(a.desc)}</span>

         <span class="notes-text">${escapeHtml(card.notes)}</span>
         <span class="notes-see-more">see more ↗</span>
        </div>` : '';
      const searchText = [card.name, card.className, card.subtitle, card.army, card.location, card['data-br'], card.branch, card.notes || '', (card.armor || []).map(a => a.name).join(' ')].join(' ').toLowerCase();

  <script>
    // Branch filter
    let activeBr = "all", activeSf = "all", activeSearch = "";

    function applyFilters() {
      const q = activeSearch.trim().toLowerCase();
      let visibleCount = 0;
      const allCards = document.querySelectorAll(".unit-card");

      allCards.forEach(c => {
        const brOk = activeBr === "all" || c.dataset.br === activeBr;
        const sfOk = activeSf === "all" || c.dataset.src === activeSf;
        const sqOk = !q || (c.dataset.search || "").includes(q);
        const visible = brOk && sfOk && sqOk;
        c.classList.toggle("hidden", !visible);
        if (visible) visibleCount++;
      });

      // Hide sub-groups with no visible cards
      document.querySelectorAll(".sub-group").forEach(sg => {
        sg.style.display = sg.querySelector(".unit-card:not(.hidden)") ? "" : "none";
      });

      // Hide branch-sections with no visible cards
      document.querySelectorAll(".branch-section").forEach(sec => {
        sec.style.display = sec.querySelector(".unit-card:not(.hidden)") ? "" : "none";
      });

      // Update count display
      const countEl = document.getElementById("searchCount");
      if (countEl) {
        if (q) {
          countEl.textContent = visibleCount + " / " + allCards.length + " units";
        } else if (activeBr !== "all" || activeSf !== "all") {
          countEl.textContent = visibleCount + " units";
        } else {
          countEl.textContent = "";
        }
      }
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        activeBr = t.dataset.br;
        applyFilters();
        if (activeBr !== "all") {
          const el = document.getElementById("sec-" + activeBr.toLowerCase().replace(" ", "-").replace(" cavalry", ""));
          if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        }
      });
    });

    document.querySelectorAll(".sf").forEach(s => {
      s.addEventListener("click", () => {
        document.querySelectorAll(".sf").forEach(x => x.classList.remove("active"));
        s.classList.add("active");
        activeSf = s.dataset.sf;
        applyFilters();
      });
    });

    // Search
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");

    searchInput.addEventListener("input", () => {
      activeSearch = searchInput.value;
      searchClear.classList.toggle("visible", activeSearch.length > 0);
      applyFilters();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      activeSearch = "";
      searchClear.classList.remove("visible");
      applyFilters();
      searchInput.focus();
    });

    // Ctrl+F / Cmd+F shortcut focuses the search bar
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "f") {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // Card open modal
    const cardModal = document.getElementById("cardModal");
    const modalBody = cardModal.querySelector(".modal-body");
    const modalClose = cardModal.querySelector(".modal-close");
    const modalPrev = document.getElementById("modalPrev");
    const modalNext = document.getElementById("modalNext");
    const modalNavCount = document.getElementById("modalNavCount");
    const modalPrevLabel = document.getElementById("modalPrevLabel");
    const modalNextLabel = document.getElementById("modalNextLabel");
    let currentCardIdx = -1;

    function getVisibleCards() {
      return Array.from(document.querySelectorAll(".unit-card:not(.hidden)"));
    }

    function updateModalNav(cards, idx) {
      const prev = cards[idx - 1];
      const next = cards[idx + 1];
      modalPrev.disabled = !prev;
      modalNext.disabled = !next;
      modalPrevLabel.textContent = prev ? (prev.querySelector(".unit-name")?.textContent || "—") : "";
      modalNextLabel.textContent = next ? (next.querySelector(".unit-name")?.textContent || "—") : "";
      modalNavCount.textContent = `${idx + 1} / ${cards.length}`;
    }

    function openCardByIndex(idx) {
      const cards = getVisibleCards();
      if (idx < 0 || idx >= cards.length) return;
      currentCardIdx = idx;
      openCardModal(cards[idx]);
      updateModalNav(cards, idx);
    }

    function initZoomPan(container, img, zoomLabel) {
      let scale = 1, tx = 0, ty = 0;
      let isDragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
      let lastTouchDist = 0;
      const ac = new AbortController();
      const sig = { signal: ac.signal };
      container._zoomCleanup = () => ac.abort();

      function clamp() {
        const maxTx = Math.max(0, (scale - 1) * container.offsetWidth / 2);
        const maxTy = Math.max(0, (scale - 1) * container.offsetHeight / 2);
        tx = Math.max(-maxTx, Math.min(maxTx, tx));
        ty = Math.max(-maxTy, Math.min(maxTy, ty));
      }

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomLabel.textContent = Math.round(scale * 100) + '%';
      }

      function zoom(factor, originX, originY) {
        const prev = scale;
        scale = Math.max(1, Math.min(6, scale * factor));
        if (scale === 1) { tx = 0; ty = 0; }
        else {
          // shift translation so zoom appears anchored to the cursor point
          const rect = container.getBoundingClientRect();
          const cx = (originX ?? rect.left + rect.width / 2) - rect.left - rect.width / 2;
          const cy = (originY ?? rect.top + rect.height / 2) - rect.top - rect.height / 2;
          tx += cx * (1 - scale / prev);
          ty += cy * (1 - scale / prev);
          clamp();
        }
        apply();
      }

      // Wheel zoom
      container.addEventListener('wheel', e => {
        e.preventDefault();
        zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
      }, { passive: false, signal: ac.signal });

      // Zoom buttons
      container.parentElement.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const a = btn.dataset.action;
          if (a === 'in') zoom(1.25);
          else if (a === 'out') zoom(1 / 1.25);
          else if (a === 'reset') { scale = 1; tx = 0; ty = 0; apply(); }
        }, sig);
      });

      // Mouse drag
      img.addEventListener('mousedown', e => {
        if (scale <= 1) return;
        e.preventDefault();
        isDragging = true;
        startX = e.clientX - tx; startY = e.clientY - ty;
        img.classList.add('panning');
      }, sig);

      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        tx = e.clientX - startX;
        ty = e.clientY - startY;
        clamp(); apply();
      }, sig);

      window.addEventListener('mouseup', () => {
        isDragging = false;
        img.classList.remove('panning');
      }, sig);

      // Touch pinch-zoom + drag
      container.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        } else if (e.touches.length === 1 && scale > 1) {
          isDragging = true;
          startX = e.touches[0].clientX - tx;
          startY = e.touches[0].clientY - ty;
        }
      }, { passive: true, signal: ac.signal });

      container.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length === 2) {
          const d = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoom(d / lastTouchDist, mx, my);
          lastTouchDist = d;
        } else if (e.touches.length === 1 && isDragging) {
          tx = e.touches[0].clientX - startX;
          ty = e.touches[0].clientY - startY;
          clamp(); apply();
        }
      }, { passive: false, signal: ac.signal });

      container.addEventListener('touchend', () => {
        isDragging = false; lastTouchDist = 0;
      }, { passive: true, signal: ac.signal });
    }

    function openCardModal(card) {
      modalBody.innerHTML = "";
      const clone = card.cloneNode(true);
      clone.classList.add("opened-card");
      clone.style.margin = "0";

      // Replace card-img with zoomable container
      const cardImg = clone.querySelector('.card-img');
      const srcImg = cardImg && cardImg.querySelector('img');
      if (srcImg && srcImg.src) {
        const container = document.createElement('div');
        container.className = 'modal-img-container';

        const wrapper = document.createElement('div');
        wrapper.className = 'modal-img-wrapper';

        const zoomImg = document.createElement('img');
        zoomImg.src = srcImg.src;
        zoomImg.alt = srcImg.alt || '';
        zoomImg.draggable = false;

        const controls = document.createElement('div');
        controls.className = 'modal-zoom-controls';
        controls.innerHTML =
          '<button class="zoom-btn" data-action="out" title="Zoom out">&#8722;</button>' +
          '<span class="zoom-level">100%</span>' +
          '<button class="zoom-btn" data-action="in"  title="Zoom in">&#43;</button>' +
          '<button class="zoom-btn" data-action="reset" title="Reset" style="font-size:11px">&#8635;</button>';

        wrapper.appendChild(zoomImg);
        container.appendChild(wrapper);
        container.appendChild(controls);
        cardImg.replaceWith(container);

        // init after append so offsetWidth is available
        requestAnimationFrame(() => {
          const label = controls.querySelector('.zoom-level');
          initZoomPan(container, zoomImg, label);
        });

        // mobile tap → fullscreen
        zoomImg.addEventListener('click', () => {
          if (window.matchMedia('(max-width: 700px)').matches) {
            openImgFullscreen(zoomImg.src, zoomImg.alt);
          }
        });
      }

      modalBody.appendChild(clone);
      cardModal.classList.add("active");
      cardModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeCardModal() {
      const container = modalBody.querySelector('.modal-img-container');
      if (container && container._zoomCleanup) container._zoomCleanup();
      const video = modalBody.querySelector('video');
      if (video) video.pause();
      cardModal.classList.remove("active");
      cardModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      modalBody.innerHTML = "";
    }

    function showVideoInModal(src) {
      let container = modalBody.querySelector('.modal-img-container');
      if (!container) {
        const cardImg = modalBody.querySelector('.card-img');
        if (!cardImg) return;
        container = document.createElement('div');
        container.className = 'modal-img-container';
        cardImg.replaceWith(container);
      } else if (container._zoomCleanup) {
        container._zoomCleanup();
      }
      container.innerHTML = '';
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';
      video.style.background = '#000';
      container.appendChild(video);
    }

    window.handleVideoLinkClick = function (linkEl) {
      const src = linkEl.getAttribute('href');
      const srcCard = linkEl.closest('.unit-card');
      if (srcCard && srcCard.classList.contains('opened-card')) {
        showVideoInModal(src);
        return;
      }
      const cards = getVisibleCards();
      const idx = cards.indexOf(srcCard);
      if (idx > -1) {
        openCardByIndex(idx);
        showVideoInModal(src);
      }
    };

    const imgFullscreen = document.getElementById('imgFullscreen');
    const imgFsImg = document.getElementById('imgFsImg');
    const imgFsClose = document.getElementById('imgFsClose');

    function openImgFullscreen(src, alt) {
      imgFsImg.src = src;
      imgFsImg.alt = alt || '';
      imgFullscreen.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeImgFullscreen() {
      imgFullscreen.classList.remove('open');
      imgFsImg.src = '';
      document.body.style.overflow = 'hidden'; // keep card modal scroll locked
    }

    imgFsClose.addEventListener('click', closeImgFullscreen);
    imgFullscreen.addEventListener('click', e => {
      if (e.target === imgFullscreen) closeImgFullscreen();
    });

    document.querySelectorAll(".unit-card").forEach(card => {
      card.addEventListener("click", () => {
        const cards = getVisibleCards();
        openCardByIndex(cards.indexOf(card));
      });
    });

    modalClose.addEventListener("click", closeCardModal);
    cardModal.addEventListener("click", e => {
      if (e.target === cardModal) closeCardModal();
    });

    modalPrev.addEventListener("click", () => openCardByIndex(currentCardIdx - 1));
    modalNext.addEventListener("click", () => openCardByIndex(currentCardIdx + 1));

    document.addEventListener("keydown", e => {
      if (!cardModal.classList.contains("active")) return;
      if (e.key === "ArrowRight") { e.preventDefault(); openCardByIndex(currentCardIdx + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); openCardByIndex(currentCardIdx - 1); }
      if (e.key === "Escape") closeCardModal();
    });

    // Scroll spy
    const sections = document.querySelectorAll(".branch-section");
    const tabs = document.querySelectorAll(".tab[data-br]");
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting && activeBr === "all") {
          const sec = e.target.dataset.sec;
          tabs.forEach(t => t.classList.remove("active"));
          const match = document.querySelector(`.tab[data-br="${sec}"]`);
          if (match) match.classList.add("active");
        }
      });
    }, { threshold: 0.3, rootMargin: "-120px 0px -50% 0px" });
    sections.forEach(s => obs.observe(s));
  </script>
</body>

</html>
