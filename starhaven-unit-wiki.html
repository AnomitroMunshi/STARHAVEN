<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>
    Starhaven · Unit Wiki
  </title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Nunito:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #07080B;
      --panel: #0E1016;
      --panel2: #12151D;
      --border: #1C2028;
      --border2: #242830;
      --parchment: #E4DCC6;
      --muted: #78736A;
      --faint: #383530;
      --gold: #C6A03C;
      --gold-dim: #685218;
      --a-vl: #1A1A1A;
      --a-l-bg: #1A3A1A;
      --a-l: #4A9A4A;
      --a-lm-bg: linear-gradient(90deg, #1A3A1A, #2A2A10);
      --a-lm: #A0A040;
      --a-m-bg: #2A2A10;
      --a-m: #9A9A38;
      --a-mh-bg: linear-gradient(90deg, #2A2A10, #0A1830);
      --a-mh: #7A9060;
      --a-h-bg: #0A1830;
      --a-h: #507AB8;
      --a-vh-bg: #380A0A;
      --a-vh: #B84848;
      --a-leg-bg: #200830;
      --a-leg: #8858C8;
      --c-own: #80C080;
      --c-own-bg: #182818;
      --c-own-b: #2A4A2A;
      --c-ally: #8080C0;
      --c-ally-bg: #181828;
      --c-ally-b: #2A2A4A;
      --c-new: #C090FF;
      --c-new-bg: #201830;
      --c-new-b: #402860;
      --c-gar: #909090;
      --c-gar-bg: #181818;
      --c-gar-b: #303030;
      --c-merc: #C09050;
      --c-merc-bg: #281808;
      --c-merc-b: #4A3018;
      --br-inf: #C86060;
      --br-ran: #60C060;
      --br-cav: #6090D0;
      --br-pol: #C0A050;
      --br-bst: #D08040;
      --br-fly: #8080D8;
      --br-mon: #C060C0;
      --br-mag: #A060D8;
      --br-rel: #D0C050;
      --br-ste: #50C0C0;
      --br-eng: #A0A050;
      --br-art: #C07040;
      --br-nav: #40A0C0;
      --br-und: #8050C0;
      --br-cmd: #C0C050;
      --br-log: #60B060;
      --br-int: #9060C0;
      --br-anm: #70B840;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--parchment);
      font-family: "Nunito", sans-serif;
      font-size: 15px;
      line-height: 1.65;
      padding: 0 0 60px;
    }

    /* NAV */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 8, 11, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border2);
      padding: 0;
    }

    .nav-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .nav-title {
      font-family: "Cinzel", serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      padding: 10px 16px 4px;
      text-align: center;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 2px;
      padding: 6px 12px 8px;
      scrollbar-width: none;
    }

    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: var(--panel2);
      color: var(--muted);
      white-space: nowrap;
      transition: all .15s;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .tab:hover {
      color: var(--parchment);
      border-color: var(--gold-dim);
    }

    .tab.active {
      color: #0A0A0A;
      border-color: transparent;
    }

    .src-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 5px 12px 8px;
      border-top: 1px solid var(--border);
    }

    .sf {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      padding: 3px 9px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      transition: all .12s;
    }

    .sf:hover,
    .sf.active {
      font-weight: 700;
    }

    .sf[data-sf="own"].active {
      background: var(--c-own-bg);
      border-color: var(--c-own-b);
      color: var(--c-own);
    }

    .sf[data-sf="ally"].active {
      background: var(--c-ally-bg);
      border-color: var(--c-ally-b);
      color: var(--c-ally);
    }

    .sf[data-sf="new"].active {
      background: var(--c-new-bg);
      border-color: var(--c-new-b);
      color: var(--c-new);
    }

    .sf[data-sf="gar"].active {
      background: var(--c-gar-bg);
      border-color: var(--c-gar-b);
      color: var(--c-gar);
    }

    .sf[data-sf="merc"].active {
      background: var(--c-merc-bg);
      border-color: var(--c-merc-b);
      color: var(--c-merc);
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 28px 16px 22px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "✦";
      margin: 0 8px;
    }

    .hero h1 {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(24px, 5vw, 52px);
      background: linear-gradient(180deg, #EDE4C8, var(--gold) 65%, var(--gold-dim));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .05em;
    }

    .hero-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .12em;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* WRAP */
    .wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 14px;
    }

    /* BRANCH SECTION */
    .branch-section {
      margin: 28px 0 0;
      scroll-margin-top: 110px;
    }

    .branch-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      border-radius: 5px 5px 0 0;
      margin-bottom: 16px;
    }

    .branch-name {
      font-family: "Cinzel", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .branch-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, currentColor, transparent);
      opacity: .3;
    }

    /* SUB-CLASS GROUP */
    .sub-group {
      margin-bottom: 20px;
    }

    .sub-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 10px;
    }

    /* UNIT CARD — Horizontal */
    .unit-card {
      display: flex;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 5px;
      overflow: hidden;
      min-height: 0;
      transition: border-color .15s;
      cursor: pointer;
    }

    .unit-card:hover {
      border-color: var(--gold-dim);
    }

    .unit-card.hidden {
      display: none;
    }

    /* CARD OPEN / MODAL */
    .card-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(7, 8, 11, 0.85);
      backdrop-filter: blur(6px);
      z-index: 250;
    }

    .card-modal.active {
      display: flex;
    }

    .card-modal .modal-card {
      position: relative;
      width: 100%;
      max-width: 980px;
      max-height: calc(100vh - 64px);
      overflow: auto;
      background: var(--panel2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0, 0, 0, .35);
    }

    .card-modal .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border2);
      background: rgba(0, 0, 0, .25);
      color: var(--parchment);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-modal .modal-body {
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .card-modal .modal-body .unit-card {
      width: 100%;
      max-width: 940px;
      display: flex;
      gap: 0;
    }

    .card-modal .modal-body .card-img {
      width: 320px;
      min-width: 320px;
      aspect-ratio: 3/4;
    }

    .card-modal .modal-body .card-body {
      padding: 20px 22px;
      gap: 12px;
    }

    .card-modal .modal-body .unit-name {
      font-size: 20px;
    }

    .card-modal .modal-body .armor-row {
      font-size: 13px;
      gap: 10px;
    }

    .card-modal .modal-body .a-slot {
      min-width: 55px;
    }

    .card-modal .modal-body .a-desc {
      font-size: 13px;
    }

    .card-modal .modal-body .branch-tag {
      font-size: 10px;
    }

    .card-modal .modal-body .class-name {
      font-size: 15px;
    }

    .card-modal .modal-body .sub-name {
      font-size: 11px;
    }

    /* ZOOM & PAN */
    .modal-img-container {
      position: relative;
      width: 320px;
      min-width: 320px;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-wrapper {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img-wrapper img {
      display: block;
      transition: transform .1s ease-out;
      cursor: grab;
      user-select: none;
    }

    .modal-img-wrapper img.panning {
      cursor: grabbing;
    }

    .modal-zoom-controls {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .zoom-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(20, 20, 30, 0.8);
      color: var(--parchment);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }

    .zoom-btn:hover {
      background: var(--gold-dim);
      color: #000;
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    .zoom-level {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      padding: 0 6px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* IMAGE */
    .card-img {
      width: 120px;
      aspect-ratio: 3/4;
      flex-shrink: 0;
      background: var(--panel2);
      position: relative;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-img .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 0;
    }

    .placeholder-icon {
      font-size: 24px;
      opacity: .25;
    }

    .placeholder-ratio {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      letter-spacing: .1em;
    }

    /* DETAILS */
    .card-body {
      flex: 1;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    /* HEADER ROW */
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .unit-name {
      font-family: "Cinzel", serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--parchment);
      line-height: 1.2;
    }

    .badge-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .src-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .sp-own {
      background: var(--c-own-bg);
      border: 1px solid var(--c-own-b);
      color: var(--c-own);
    }

    .sp-ally {
      background: var(--c-ally-bg);
      border: 1px solid var(--c-ally-b);
      color: var(--c-ally);
    }

    .sp-new {
      background: var(--c-new-bg);
      border: 1px solid var(--c-new-b);
      color: var(--c-new);
    }

    .sp-gar {
      background: var(--c-gar-bg);
      border: 1px solid var(--c-gar-b);
      color: var(--c-gar);
    }

    .sp-merc {
      background: var(--c-merc-bg);
      border: 1px solid var(--c-merc-b);
      color: var(--c-merc);
    }

    /* ARMOR BADGE */
    .armor-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .a-vl {
      background: #1A1A1A;
      color: #666;
    }

    .a-l {
      background: #1A3A1A;
      color: #4A9A4A;
    }

    .a-lm {
      background: #252510;
      color: #9A9840;
    }

    .a-m {
      background: #2A2A10;
      color: #9A9838;
    }

    .a-mh {
      background: #1A2418;
      color: #709060;
    }

    .a-h {
      background: #0A1830;
      color: #5078B8;
    }

    .a-vh {
      background: #380A0A;
      color: #B84848;
    }

    .a-leg {
      background: #200830;
      color: #8858C8;
    }

    .a-na {
      background: #1A1A1A;
      color: #555;
    }

    /* META */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .branch-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .class-name {
      font-size: 13.5px;
      color: var(--parchment);
      font-weight: 600;
    }

    .sub-name {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* ARMOR LIST */
    .armor-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .armor-row {
      display: flex;
      gap: 7px;
      align-items: baseline;
      font-size: 12.5px;
      line-height: 1.35;
    }

    .a-slot {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .06em;
      min-width: 46px;
      flex-shrink: 0;
    }

    .a-name {
      color: var(--gold);
      font-weight: 600;
      font-size: 12.5px;
    }

    .a-desc {
      color: var(--muted);
      font-size: 12px;
    }

    /* FOOTER */
    .card-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loc-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .loc-tag::before {
      content: "📍 ";
      font-size: 9px;
    }

    .army-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--muted);
      border-left: 1px solid var(--border2);
      padding-left: 10px;
    }

    /* BRANCH SPECIFIC COLORS */
    .bh-inf {
      background: #3A0A0A;
      color: var(--br-inf);
    }

    .bh-ran {
      background: #0A2A0A;
      color: var(--br-ran);
    }

    .bh-cav {
      background: #0A1030;
      color: var(--br-cav);
    }

    .bh-pol {
      background: #2A2008;
      color: var(--br-pol);
    }

    .bh-bst {
      background: #2A1408;
      color: var(--br-bst);
    }

    .bh-fly {
      background: #08083A;
      color: var(--br-fly);
    }

    .bh-mon {
      background: #200A20;
      color: var(--br-mon);
    }

    .bh-mag {
      background: #100820;
      color: var(--br-mag);
    }

    .bh-rel {
      background: #2A2008;
      color: var(--br-rel);
    }

    .bh-ste {
      background: #081E1E;
      color: var(--br-ste);
    }

    .bh-eng {
      background: #181808;
      color: var(--br-eng);
    }

    .bh-art {
      background: #200E08;
      color: var(--br-art);
    }

    .bh-nav {
      background: #081820;
      color: var(--br-nav);
    }

    .bh-und {
      background: #0A0618;
      color: var(--br-und);
    }

    .bh-cmd {
      background: #202008;
      color: var(--br-cmd);
    }

    .bh-log {
      background: #0A180A;
      color: var(--br-log);
    }

    .bh-int {
      background: #100818;
      color: var(--br-int);
    }

    .bh-spt {
      background: #081818;
      color: #50A0A0;
    }

    .bh-anm {
      background: #0E2006;
      color: var(--br-anm);
    }

    .bt-inf {
      background: #3A0A0A;
      color: var(--br-inf);
    }

    .bt-ran {
      background: #0A2A0A;
      color: var(--br-ran);
    }

    .bt-cav {
      background: #0A1030;

    }

    }

    }

    }

    .bt-mag {
      background: #100820;

    }

    .bt-rel {
      background: #2A2008;
      color: var(--br-rel);
    }

    .bt-ste {
      background: #081E1E;
      color: var(--br-ste);
    }

    .bt-eng {
      background: #181808;
      color: var(--br-eng);
    }

    .bt-art {
      background: #200E08;
      color: var(--br-art);
    }

    .bt-nav {
      background: #081820;
      color: var(--br-nav);
    }

    .bt-und {
      background: #0A0618;
      color: var(--br-und);
    }

    .bt-cmd {
      background: #202008;
      color: var(--br-cmd);
    }

    .bt-log {
      background: #0A180A;
      color: var(--br-log);
    }

    .bt-int {
      background: #100818;
      color: var(--br-int);
    }

    .bt-spt {
      background: #081818;
      color: #50A0A0;
    }

    .bt-anm {
      background: #0E2006;
      color: var(--br-anm);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      border-top: 1px solid var(--border);
    }

    .motto {
      font-family: "Cinzel", serif;
      font-size: 12px;
      letter-spacing: .1em;
      color: var(--gold-dim);
      text-transform: uppercase;
    }

    .fsub {

    const BRANCH_TAG_CLASSES = {
      "Infantry": "bt-inf", "Ranged": "bt-ran", "Cavalry": "bt-cav", "Polearm": "bt-pol", "Beast Cavalry": "bt-bst", "Flying": "bt-fly", "Magic": "bt-mag", "Religious": "bt-rel", "Stealth": "bt-ste", "Engineering": "bt-eng", "Artillery": "bt-art", "Naval": "bt-nav", "Undead": "bt-und", "Command": "bt-cmd", "Support": "bt-spt", "Intelligence": "bt-int", "Animals": "bt-anm"
    };
    const BRANCH_HEADER_CLASSES = {
      "inf": "bh-inf", "ran": "bh-ran", "cav": "bh-cav", "pol": "bh-pol", "bst": "bh-bst", "fly": "bh-fly", "mag": "bh-mag", "rel": "bh-rel", "ste": "bh-ste", "eng": "bh-eng", "art": "bh-art", "nav": "bh-nav", "und": "bh-und", "cmd": "bh-cmd", "spt": "bh-spt", "int": "bh-int", "anm": "bh-anm"
    };
    const SRC_PILL_CLASSES = { own: "sp-own", ally: "sp-ally", new: "sp-new", gar: "sp-gar", merc: "sp-merc" };

    function escapeHtml(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function renderCard(card) {
      const image = card.image ? `<img alt="${escapeHtml(card.imageAlt || card.name || '')}" src="${escapeHtml(card.image)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>` : '';
      const placeholder = `<div class="placeholder" style="${card.image ? 'display:none' : 'display:flex'}"><div class="placeholder-icon">🛡</div><div class="placeholder-ratio">3:4</div></div>`;
      const badgeClass = SRC_PILL_CLASSES[card['data-src']] || 'sp-own';
      const branchTagClass = BRANCH_TAG_CLASSES[card['data-br']] || '';
      const armorRows = (card.armor || []).map(a => `
         <div class="armor-row">
          <span class="a-slot">${escapeHtml(a.slot)}</span>
          <span class="a-name">${escapeHtml(a.name)}</span>
          <span class="a-desc">${escapeHtml(a.desc)}</span>
         </div>`).join('');
      return `      <div class="unit-card" data-br="${escapeHtml(card['data-br'])}" data-src="${escapeHtml(card['data-src'])}" id="${escapeHtml(card.id)}">
       <div class="card-img">
        ${image}${placeholder}
       </div>
       <div class="card-body">
        <div class="card-head">
         <span class="unit-name">${escapeHtml(card.name)}</span>
         <div class="badge-row">
          <span class="src-pill ${badgeClass}">${escapeHtml(card.srcPill || card['data-src'])}</span>
          <span class="${escapeHtml(card.armorClass)}">${escapeHtml(card.armorBadge || '')}</span>
         </div>
        </div>
        <div class="card-meta">
         <span class="branch-tag ${branchTagClass}">${escapeHtml(card.branch || card['data-br'])}</span>
         <span class="class-name">${escapeHtml(card.className || '')}</span>
         <span class="sub-name">${escapeHtml(card.subtitle || '')}</span>
        </div>
        <div class="armor-list">${armorRows}
        </div>
        <div class="card-foot">
         <span class="loc-tag">${escapeHtml(card.location || '')}</span>
         <span class="army-tag">${escapeHtml(card.army || '')}</span>
        </div>
       </div>
      </div>`;
    }

    function renderUnitWiki() {
      const container = document.getElementById('unit-content');
      if (!container) return;
      container.innerHTML = UNIT_DATA.map(section => {
        const sectionRows = section.subgroups.map(group => `
     <div class="sub-group">
      <div class="sub-label">${escapeHtml(group.label)}</div>
      <div class="card-grid">${group.cards.map(renderCard).join('')}
      </div>
     </div>`).join('');
        return `
    <div class="branch-section" data-sec="${escapeHtml(section['data-sec'])}" id="${escapeHtml(section.id)}">
     <div class="branch-header ${BRANCH_HEADER_CLASSES[section['data-sec']] || ''}">
      <span class="branch-name">${escapeHtml(section.branch)}</span>
      <span class="branch-line"></span>
     </div>${sectionRows}
    </div>`;
      }).join('');
    }

    renderUnitWiki();

  <script>
    // Branch filter
    let activeBr = "all", activeSf = "all";

    function applyFilters() {
      document.querySelectorAll(".unit-card").forEach(c => {
        const src = c.dataset.src;
        const br = c.dataset.br;
        const brOk = activeBr === "all" || br === activeBr;
        const sfOk = activeSf === "all" || src === activeSf;
        c.classList.toggle("hidden", !(brOk && sfOk));
      });
      // Show/hide sections
      document.querySelectorAll(".branch-section").forEach(sec => {
        const secBr = sec.dataset.sec;
        const match = activeBr === "all" || activeBr === secBr || sec.querySelector(".unit-card:not(.hidden)");
        if (activeBr !== "all") sec.style.display = sec.querySelector(".unit-card:not(.hidden)") ? "" : "none";
        else sec.style.display = "";
      });
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        activeBr = t.dataset.br;
        applyFilters();
        if (activeBr !== "all") {
          const el = document.getElementById("sec-" + activeBr.toLowerCase().replace(" ", "-").replace(" cavalry", ""));
          if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
        }
      });
    });

    document.querySelectorAll(".sf").forEach(s => {
      s.addEventListener("click", () => {
        document.querySelectorAll(".sf").forEach(x => x.classList.remove("active"));
        s.classList.add("active");
        activeSf = s.dataset.sf;
        applyFilters();
      });
    });

    // Card open modal
    const cardModal = document.getElementById("cardModal");
    const modalBody = cardModal.querySelector(".modal-body");
    const modalClose = cardModal.querySelector(".modal-close");
    function openCardModal(card) {
      modalBody.innerHTML = "";
      const clone = card.cloneNode(true);
      clone.classList.add("opened-card");
      clone.style.margin = "0";
      modalBody.appendChild(clone);
      cardModal.classList.add("active");
      cardModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }
    function closeCardModal() {
      cardModal.classList.remove("active");
      cardModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      modalBody.innerHTML = "";
    }
    document.querySelectorAll(".unit-card").forEach(card => {
      card.addEventListener("click", () => openCardModal(card));
    });
    modalClose.addEventListener("click", closeCardModal);
    cardModal.addEventListener("click", e => {
      if (e.target === cardModal) closeCardModal();
    });

    // Scroll spy
    const sections = document.querySelectorAll(".branch-section");
    const tabs = document.querySelectorAll(".tab[data-br]");
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting && activeBr === "all") {
          const sec = e.target.dataset.sec;
          tabs.forEach(t => t.classList.remove("active"));
          const match = document.querySelector(`.tab[data-br="${sec}"]`);
          if (match) match.classList.add("active");
        }
      });
    }, { threshold: 0.3, rootMargin: "-120px 0px -50% 0px" });
    sections.forEach(s => obs.observe(s));
  </script>
</body>

</html>
